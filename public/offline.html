<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#001d3d">
  <title>Anda sedang offline — PRIDA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #001d3d;
      background: #f4f8fc;
      font-family: system-ui, sans-serif;
    }
    main {
      width: min(100%, 520px);
      padding: 32px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 12px 40px rgba(0, 29, 61, .10);
      text-align: center;
    }
    h1 { margin-top: 0; }
    p { line-height: 1.6; color: #526174; }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: #0056b3;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Koneksi internet terputus</h1>
    <p>Portal belum dapat memuat halaman ini. Periksa koneksi internet, lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
